name: Publish and sign Pi worker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [pi-core, pi-polyglot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: v3.1.2
      - id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/skharness-${{ matrix.target }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox/pi/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Keyless-sign immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify signature identity and issuer
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify "$IMAGE@$DIGEST"
          --certificate-identity-regexp
          "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pi-image.yml@refs/tags/v"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  vulnerability-gate:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [pi-core, pi-polyglot]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/skharness-${{ matrix.target }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: anchore/scan-action@v6
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif
